# E2E Tests for analytics-kotlin
# Copy this file to: analytics-kotlin/.github/workflows/e2e-tests.yml
#
# This workflow:
# 1. Checks out the SDK and sdk-e2e-tests repos
# 2. Applies the HTTP patch to allow mock server testing
# 3. Builds the SDK and e2e-cli
# 4. Runs the e2e test suite

name: E2E Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      e2e_tests_ref:
        description: 'Branch or ref of sdk-e2e-tests to use'
        required: false
        default: 'main'

jobs:
  e2e-tests:
    # Skip on fork PRs where repo secrets aren't available
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-x64

    steps:
      - name: Checkout SDK
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: sdk

      - name: Checkout sdk-e2e-tests
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: segmentio/sdk-e2e-tests
          ref: ${{ inputs.e2e_tests_ref || 'main' }}
          token: ${{ secrets.E2E_TESTS_TOKEN }}
          path: sdk-e2e-tests

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Apply HTTP patch for testing
        working-directory: sdk
        run: |
          git apply ../sdk-e2e-tests/patches/analytics-kotlin-http.patch
          echo "HTTP patch applied successfully"

      - name: Build Kotlin SDK and e2e-cli
        working-directory: sdk
        run: ./gradlew :e2e-cli:jar

      - name: Find e2e-cli jar
        id: find-jar
        working-directory: sdk
        run: |
          JAR_PATH=$(find e2e-cli/build/libs -name "e2e-cli-*.jar" | head -1)
          echo "jar_path=$JAR_PATH" >> $GITHUB_OUTPUT

      - name: Run E2E tests
        working-directory: sdk-e2e-tests
        run: |
          ./scripts/run-tests.sh \
            --sdk-dir "${{ github.workspace }}/sdk/e2e-cli" \
            --cli "java -jar ${{ github.workspace }}/sdk/${{ steps.find-jar.outputs.jar_path }}" \
            --sdk-path "${{ github.workspace }}/sdk"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-test-results
          path: sdk-e2e-tests/test-results/
          if-no-files-found: ignore
